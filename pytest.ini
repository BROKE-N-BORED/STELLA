[pytest]
# R128: a hung test times out instead of holding CI (or a local
# run) until GitHub's 6-hour job default. The timeout sits above
# the slowest legitimate test — measured, not guessed: the
# slowest single test in the v0.29.0 builder run was 11.68s
# (test_stylesheet_is_stellas_own_look), and 300s is ~25x that,
# with room for a loaded machine and for the training-stack tests
# (tiny-model runs, unmeasured here — they skip without torch —
# but bounded well under this; re-measure if a full-stack run
# shows a slower legitimate test). Signal method (the default):
# it fires in the main thread, which is where pytest runs, and it
# works with the in-process Qt GUI tests — the thread method
# cannot, because Qt objects must live in the main thread.
# Verified with deliberately hung tests (plain and GUI): both
# failed by timeout in ~5s. Honest limit: a hang inside a
# C-level Qt call (a modal dialog's exec, a QThread.wait) may not
# be interruptible by a signal; the timeout guards Python-level
# hangs, and CI's own job timeout remains the backstop for a
# C-level one.
timeout = 300
timeout_method = signal
markers =
    gui: tests that open the Qt window (in-process)
