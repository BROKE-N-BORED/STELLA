# STELLA CI (T130): the base suite on every push and pull request, plus
# the training-stack suite where feasible (the torch install is big,
# so it runs in its own job and does not block the base result).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  base:
    name: base suite (PySide6 only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install --timeout 120 --retries 10 \
            -r requirements-base.txt pytest
      - name: Run the suite
        env:
          QT_QPA_PLATFORM: offscreen
          TMPDIR: /tmp
        run: python -m pytest tests/ -q

  train:
    name: full suite (training stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base + training requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install --timeout 120 --retries 10 \
            -r requirements-base.txt -r requirements-train.txt pytest
      - name: Run the suite
        env:
          QT_QPA_PLATFORM: offscreen
          TMPDIR: /tmp
        run: python -m pytest tests/ -q
