# STELLA CI (T130): the base suite on every push and pull request, plus
# the training-stack suite where feasible (the torch install is big,
# so it runs in its own job and does not block the base result).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # R120: weekly scheduled run, so bit-rot (a PySide6 or
  # runner-image change breaking the suite) is noticed without a
  # push. Scheduled runs need no secrets and run on main only.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  # R120: the desktop files and the shell scripts are part of the
  # product (double-click install, repair, uninstall), so CI
  # validates them: desktop-file-validate over every .desktop
  # file (T64's "validates clean" claim, previously unverified
  # anywhere) and shellcheck over every script. Both tools are
  # clean on the tree today — no failing CI on day one.
  lint:
    name: lint (desktop files + shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils shellcheck
      - name: Validate desktop files
        run: desktop-file-validate *.desktop
      - name: Shellcheck scripts
        run: shellcheck *.sh stella-cli

  base:
    name: base suite (PySide6 only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install --timeout 120 --retries 10 \
            -r requirements-base.txt pytest pytest-timeout
      - name: Run the suite
        env:
          QT_QPA_PLATFORM: offscreen
          TMPDIR: /tmp
        run: python -m pytest tests/ -q

  train:
    name: full suite (training stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base + training requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install --timeout 120 --retries 10 \
            -r requirements-base.txt -r requirements-train.txt pytest pytest-timeout
      - name: Run the suite
        env:
          QT_QPA_PLATFORM: offscreen
          TMPDIR: /tmp
        run: python -m pytest tests/ -q
